name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and Pillow
        run: python -m pip install -r skills/resolve-cut/scripts/requirements.txt
      - name: Every script compiles and answers --help
        run: |
          for f in skills/resolve-cut/scripts/*/*.py; do
            python -m py_compile "$f"
            python "$f" --help > /dev/null
          done
      - name: Resolve scripts against a fake Resolve API
        run: python tests/test_resolve_scripts.py
      - name: Cut list, markers and dossier on synthetic transcripts
        run: python tests/test_media_scripts.py
      - name: Every ffmpeg call runs under nice with 2 threads per input and encoder
        run: python tests/test_ffmpeg_threads.py
